<!DOCTYPE html>
<html>
<head>

<title>FitPulse - Log Activity</title>

<link rel="stylesheet" href="./style.css">
<script src="./script.js"></script>

</head>

<body class="dashboard-body">

<div class="user-box" onclick="toggleMenu()">
  <div class="avatar" id="avatar"></div>
  <span id="userName"></span>

  <div class="dropdown" id="dropdownMenu">
    <p onclick="logout()">Logout</p>
  </div>
</div>

<div class="dashboard-layout">

  <div class="sidebar">
    <div class="logo">
      ⚡ FitPulse
    </div>

    <nav>
      <a class="nav-btn" href="dashboard.html">
        🏠 Dashboard
      </a>

      <a class="nav-btn active" href="home.html">
        📈 Log Activity
      </a>

      <a class="nav-btn logout" href="index.html">
        🚪 Logout
      </a>
    </nav>
  </div>

  <div class="main-content">

    <div class="activity-card">

      <div class="activity-title">
        📊 Log Health Activity
      </div>

      <label class="form-label">
        Heart Rate
      </label>

      <input type="range" min="0" max="200" value="0"
        id="heartRate"
        oninput="hrValue.innerText=this.value; updateHealthStatus()">

      <div class="value">
        ❤️ <span id="hrValue">0</span> BPM
      </div>

      <label class="form-label">
        Steps
      </label>

      <input type="range" min="0" max="20000" value="0"
        id="steps"
        oninput="stepsValue.innerText=this.value; updateHealthStatus()">

      <div class="value">
        👣 <span id="stepsValue">0</span>
      </div>

      <label class="form-label">
        Sleep
      </label>

      <input type="range" min="0" max="12" step="0.1" value="0"
        id="sleep"
        oninput="sleepValue.innerText=this.value; updateHealthStatus()">

      <div class="value">
        😴 <span id="sleepValue">0</span> Hours
      </div>

      <label class="form-label">
        Timestamp
      </label>

      <input class="form-input" type="datetime-local" id="timestamp">

      <div id="healthStatus" class="health-preview">
        Health status will be analyzed after saving.
      </div>

      <button type="button" class="submit-btn" onclick="saveHealthData(event, this)">
        Save Health Entry
      </button>

    </div>

  </div>

</div>

<script>
// Reset form on page load
document.addEventListener("DOMContentLoaded", function () {
  document.body.offsetHeight; // Force reflow
});

// Reset when user navigates back to home
window.addEventListener("pageshow", function(event) {
  if (event.persisted) {
    // Page was restored from back/forward cache
    location.reload();
  }
});
</script>

</body>
</html>
